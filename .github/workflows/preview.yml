name: Publish H5 preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
      - run: node scripts/build-preview.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-preview
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published page and bundled illustrations
        env:
          PREVIEW_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import base64, json, os, re, time, urllib.request
          base = os.environ['PREVIEW_URL'].rstrip('/') + '/game/'
          for attempt in range(6):
              try:
                  def fetch(name):
                      with urllib.request.urlopen(base + name + '?verify=' + os.environ['GITHUB_SHA'], timeout=25) as response:
                          return response.read().decode('utf-8')
                  html = fetch('index.html')
                  assert len(html.encode('utf-8')) < 500000, 'Initial HTML is too large'
                  assert html.index('id="splash"') < 7000, 'Visible loader must precede large resources'
                  assert 'bootRetry' in html, 'Missing slow-load retry action'
                  match = re.search(r'window.WORD_POP_ASSETS=(\{.*?\});', html)
                  assert match, 'Bundled illustrations missing from published HTML'
                  assets = json.loads(match.group(1))
                  for name in ['lion', 'icons-a', 'icons-b']:
                      content = base64.b64decode(assets[name].split(',', 1)[1], validate=True)
                      assert content[:4] == b'RIFF' and content[8:12] == b'WEBP', name
                  app = fetch('app.js')
                  assert 'Holly LU' in app and 'share-wechat' in app and 'Ajuna Jiang' in app
                  for module in ['assets.mjs', 'invitation.mjs', 'styles.css', 'icons.js', 'words.js', 'config.js']:
                      assert len(fetch(module)) > 20, module
                  print('Published H5 verified: 3 embedded WebP illustrations, player profile, share entry, modules.')
                  break
              except Exception:
                  if attempt == 5:
                      raise
                  time.sleep(8)
          PY
